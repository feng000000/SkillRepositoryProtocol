[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-repository-protocol"
version = "0.1.0"
description = "Skill Repository Protocol 的 Python 解析器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35,<2"]

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skill_repository_protocol"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=skill_repository_protocol --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["skill_repository_protocol"]

[tool.basedpyright]
pythonVersion = "3.10"
include = ["src", "tests"]
typeCheckingMode = "standard"
